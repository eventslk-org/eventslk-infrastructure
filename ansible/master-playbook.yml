---
- name: Setup Kubernetes Master
  hosts: master
  become: yes
  tasks:
    - name: Check if Kubernetes cluster is already initialized
      stat:
        path: /etc/kubernetes/admin.conf
      register: kubeadm_init_status

    - name: Reset kubeadm (only when cluster_reset=true is passed)
      shell: kubeadm reset -f
      when: cluster_reset | default(false) | bool
      ignore_errors: yes

    - name: Initialize Kubernetes cluster
      shell: kubeadm init --pod-network-cidr=192.168.0.0/16
      register: init_output
      when: not kubeadm_init_status.stat.exists or (cluster_reset | default(false) | bool)

    - name: Create .kube directory
      file:
        path: /home/ubuntu/.kube
        state: directory
        mode: '0700'
        owner: ubuntu
        group: ubuntu

    - name: Copy admin.conf to user kube config
      copy:
        src: /etc/kubernetes/admin.conf
        dest: /home/ubuntu/.kube/config
        remote_src: yes
        owner: ubuntu
        group: ubuntu
        mode: '0600'

    - name: Wait for Kubernetes API server to become ready
      shell: kubectl cluster-info
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config
      register: cluster_info
      until: cluster_info.rc == 0
      retries: 15
      delay: 10
      become: false

    - name: Install Calico Network Plugin
      shell: kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.27.0/manifests/calico.yaml
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config
      become: false

    - name: Get join command
      shell: kubeadm token create --print-join-command
      register: join_command

    - name: Save join command locally
      local_action:
        module: copy
        content: "{{ join_command.stdout }}"
        dest: ./join-command.sh
        mode: '0600'
      become: false
